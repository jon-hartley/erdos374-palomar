version: "v0.4"

project:
  name: "Erdős Problem #374: positive lower density of D₆ and the growth of D₃–D₅"
  description: >-
    For m > 1 let F(m) be the least k ≥ 2 such that a₁! a₂! ⋯ a_k! is a perfect square for
    some 1 ≤ a₁ < ⋯ < a_k = m, and let D_k = {m > 1 : F(m) = k}. Erdős and Graham asked
    whether D₆ has positive lower density (Erdős Problem #374). This repository proves in
    Lean 4 with Mathlib that D₆ has positive lower density, together with the main theorem of
    Hartley–Olson: an explicit squarefree set 𝒜 has natural density δ > 0, the members of D₆
    in 𝒜 with a prime factor larger than m^{99/100} have natural density exactly
    δ log(100/99), and D₆ has lower density at least δ log(100/99). It also proves
    D₃(X) = κ₃ √X + O(X^{2/5+ε}) with κ₃ = Σ_{q ∈ 𝒬} q^{-1/2} (a convergent series over the
    nontrivial squarefree kernels of factorials), D₃(X) ≍ √X, and that D₄ and D₅ have lower
    densities at least 1/4 and log 2 / 40000. The analytic inputs (the prime number theorem,
    an almost-all short-interval prime estimate of Harman type, a reciprocal-prime
    equidistribution estimate, Weil-type bounds for hyperelliptic curves, and large-sieve
    estimates) are proved within the development; no hypotheses or custom axioms remain.
  authors:
    - "Jonathan S. Hartley"
    - "Matthew A. Olson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jonathan S. Hartley"

