fidelity:
  divergences: >-
    (1) The factorial indices are positive integers; allowing 0 or 1 does not change F(m) for
    m > 1 (explained in Challenge.lean). (2) F(m) is not defined as a function; D k is defined
    directly as the set of m > 1 with a k-factor representation and no j-factor
    representation for 2 ≤ j < k. (3) "Lower density at least δ" is stated as "for every
    ε > 0, eventually count(N)/N ≥ δ − ε", which is equivalent to liminf ≥ δ; natural density
    is stated with Filter.Tendsto. (4) Theorem 7.1(i) is stated as: for every ε > 0 there is C
    with |D₃(X) − κ₃√X| ≤ C X^{2/5+ε} for all large X, and κ₃ is a tsum whose summability is
    part of the statement. (5) Theorem 1.1 is stated with α = 1/100 and the explicit constant
    δ log(100/99), as in the paper. Otherwise none known.

