status:
  scope: >-
    Everything stated in Challenge.lean is proved, with no hypotheses: D₆ has positive lower
    density; Theorem 1.1 of the paper (natural density of 𝒜, exact natural density of
    D₆ ∩ B_{1/100}, lower density of D₆); the D₃ asymptotic with a convergent constant κ₃;
    D₃(X) ≍ √X; lower-density bounds 1/4 for D₄ and log 2 / 40000 for D₅. Not formalized or
    claimed: whether D₆ (or D₄, D₅) has a natural density, the exact lower densities, the
    numerical value of κ₃, and the Erdős–Graham bound F(m) ≤ 6 for composite m.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

