      status: "proved"
      note: "Convergence of κ₃ and D₃(X) = κ₃√X + O(X^{2/5+ε})."
    - source: "Theorem 7.1(i)"
      lean: "ErdosProblem374.D3_order"
      module: "Challenge"
      status: "proved"
      note: "√X/2 ≤ D₃(X) ≤ C√X for large X."
    - source: "Theorem 7.1(ii)"
